<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOISt Login</title>
    <link rel="stylesheet" href="sign.css">
</head>
<body>
    <form class="signup-form">

        <h1>Sign Up</h1>

        <p class="form-description">
            Welcome to the MOIST Student Registration System.
        </p>

        <label for="fullname">Full Name:</label>
        <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>

        <label for="">Email Address:</label>
        <input type="text" id="email" name="name" placeholder="example@gmail.com">

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="Create a password" required>

        <label for="age">Enter Age: </label>
        <input type="number" id="age" name="age" placeholder="Enter Your Age:" required>

        <label for="birthdate">Date of Birth:</label>
        <input type="date" id="birthdate" name="birthdate" required>
        
        <label>Gender: </label>
            <div class="Gender">
                <label><input type="radio" name="gender" value="Male" required>Male</label>
                <label><input type="radio" name="gender" value="Female">Female</label>
                <label><input type="radio" name="gender" value="Rather not to say">Rather not to say</label>
        </div>

        <label for="Course">Course:</label>
        <select id="Course" name="Course" required>
            <option value="">Select Course: </option>
            <option value="">Select Course:</option>
            <option value="">BS Information Technology</option>
            <option value="">BS tourism Management </option>
            <option value="">Bachelor of Elementary Education</option>
            <option value="">Bacherlor of Secondary Education</option>
        </select>

        <label>Enter year level: </label>
            <div class="Gender">

                <label><input type="radio" name="gender" value="Male" required>First Year</label>
                <label><input type="radio" name="gender" value="Female">Second Year</label>
                <label><input type="radio" name="gender" value="Rather not to say">Third Year</label>
                <label><input type="radio" name="gender" value="Rather not to say">Fourth Year</label>

            </div>

        <label>Skill or Interest: </label>
            <div class="check">

                <label><input type="checkbox" name="gender" value="Male">HTML</label>
                <label><input type="checkbox" name="gender" value="Female">CSS</label>
                <label><input type="checkbox" name="gender" value="Rather not to say">JavaScript</label>
                <label><input type="checkbox" name="gender" value="Rather not to say">Graphic Design</label>
                <label><input type="checkbox" name="gender" value="Rather not to say">Networking</label>

            </div>

        <label for="address">Enter Address: </label>
        <textarea id="address" name="address" placeholder="Enter your address"></textarea>
        <label for="comment">Expectation: </label>
        <textarea id="comment" name="comment" placeholder="Comment or Expectation"></textarea >



        <div class="submit">
            <button  type="submit">Submit</button>
            <button class="r" type="reset">clear</button>
            <button class="v" type="view">view</button>
            
        </div>
        

    </form>

</body>
</html>
